name: CI / Deploy

# Every push and PR: install, check the registry against the code, typecheck and build.
# Pushes to main also deploy the docs site + shadcn registry to https://expressive-react.moolerz.et
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # registry check (files/deps match imports) → registry.json → public/r → tsc → vite build
      - run: pnpm build

      # theme presets: WCAG AA contrast in light and dark, preset helpers
      - run: pnpm test

      - name: Sanity-check the build
        run: |
          test -f dist/index.html
          test -f dist/r/registry.json
          test -f dist/r/button.json
          echo "registry items: $(ls dist/r | wc -l)"

      - name: npm package builds and packs
        working-directory: packages/expressive-react
        run: |
          node scripts/build.mjs
          npm pack --dry-run --ignore-scripts

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://expressive-react.moolerz.et
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # The deploy key is restricted server-side to `rrsync -wo /var/www/expressive-react`,
      # so "./" is the site root and the key can't do anything but write there.
      # --delay-updates swaps files in at the end so visitors never see a half-updated site.
      - name: Deploy
        run: |
          rsync -rlz --checksum --delete --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" \
            dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:./"

      - name: Smoke test
        run: |
          for path in / /docs/button /blocks /r/registry.json /r/button.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://expressive-react.moolerz.et$path")
            echo "$path → $code"
            test "$code" = 200
          done

      - if: always()
        run: rm -f ~/.ssh/deploy_key
